<div class="header">
  @if (viewVersion === ViewVersions.large) {
    <h5 class="header_content">{{item.name}}</h5>
  }
  @else {
    <h6 class="header_content">{{item.name}}</h6>
  }
</div>
<ruckit-toggle
  restrictedToggle
  class="ruckit-toggle"
  [formControl]="toggleControl"
  [lock]="isRestricted">
</ruckit-toggle>
