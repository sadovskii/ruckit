<app-layout
  [viewVersion]="viewVersion"
  header="Settings"
  *ngIf="selectedTheme">
  <div class="inner-settings">
    <app-settings-item
      class="inner-settings__item"
      header="Appearance"
      description="Customize how Ruckit looks on your device">
      <nb-select *ngIf="selectedTheme" placeholder="Select Showcase" [(selected)]="selectedTheme" (selectedChange)="onChangeTheme()">
        <nb-option value="default">Light</nb-option>
        <nb-option value="dark">Dark</nb-option>
      </nb-select>
    </app-settings-item>
  </div>
  
</app-layout>
