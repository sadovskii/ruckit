<ruckit-dialog
  [header]="'password_enter_title' | i18n"
  [tagValue]="'password_enter_tag' | i18n"
  [tagType]="TagType.Red"
  (closed)="onClose()">
  <div class="enter-password">
    <form class="enter-password-inputs" [formGroup]="formGroup" (ngSubmit)="onSubmit()">
      <ruckit-password-input
        class="enter-password-inputs__item password-input"
        formControlName="enterPassword"
        [status]="invalidAfterClick && formGroup.controls.enterPassword.invalid ? 'danger' : 'basic'"
        [fullWidth]="true"
        [placeholder]="'password_enter_placeholder' | i18n">
      </ruckit-password-input>
      <button nbButton fullWidth>{{ 'password_enter_submit' | i18n }}</button>
    </form>
  </div> 
</ruckit-dialog>
