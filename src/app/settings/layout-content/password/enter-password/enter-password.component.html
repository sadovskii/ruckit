<ruckit-dialog
  [header]="headerMessageKey | i18n"
  [tagValue]="tagMessageKey | i18n"
  [tagIcon]="tagIcon"
  [tagType]="TagType.Neutral"
  (closed)="onClose()">
  <app-reset-password-confirm
    *ngIf="view === 'confirmReset'; else enterPasswordView"
    [delayMinutes]="delayMinutes"
    (startReset)="onStartReset()"
    (goBack)="onGoBack()">
  </app-reset-password-confirm>
  <ng-template #enterPasswordView>
    <div class="enter-password">
      <form class="enter-password-inputs" [formGroup]="formGroup" (ngSubmit)="onSubmit()">
        <!-- the reset status comes first: it explains why the password is still being asked -->
        <ruckit-info-block
          *ngIf="isResetPending"
          class="enter-password-inputs__item reset-info"
          icon="clock-20"
          [header]="'password_reset_in_progress_title' | i18n"
          [lines]="['password_reset_in_progress_remaining' | i18n: remainingTime]">
        </ruckit-info-block>
        <ruckit-password-input
          class="enter-password-inputs__item password-input"
          formControlName="enterPassword"
          [status]="invalidAfterClick && formGroup.controls.enterPassword.invalid ? 'danger' : 'basic'"
          [fullWidth]="true"
          [placeholder]="'password_enter_placeholder' | i18n">
        </ruckit-password-input>
        <button nbButton fullWidth>{{ 'password_enter_submit' | i18n }}</button>
      </form>
      <ruckit-link-button
        *ngIf="!isResetPending"
        class="enter-password__link"
        (click)="onForgotPassword()">
        {{ 'password_enter_forgot' | i18n }}
      </ruckit-link-button>
      <ruckit-link-button
        *ngIf="isResetPending"
        class="enter-password__link"
        (click)="onCancelReset()">
        {{ 'password_enter_cancel_reset' | i18n }}
      </ruckit-link-button>
    </div>
  </ng-template>
</ruckit-dialog>
