<app-layout
  [header]="'password_title' | i18n"
  *ngIf="selectedInquirePassowrdPeriod && isHasPassword != null">
	<div class="password">
		<app-settings-item
      class="password__item"
      [header]="'password_request_title' | i18n"
      [description]="'password_request_description' | i18n">
      <ruckit-toggle
        class="ruckit-toggle"
        [preventDefault]="true"
        [lock]="true"
        (onClick)="onRequestToggleClick()"
        [checked]="isHasPassword">
      </ruckit-toggle>
    </app-settings-item>
    <app-settings-item
      class="password__item"
      [header]="'password_inquire_title' | i18n"
      [description]="'password_inquire_description' | i18n"
      [disabled]="!isHasPassword">
      <nb-select
        [disabled]="!isHasPassword"
        [placeholder]="'common_select_placeholder' | i18n"
        [(selected)]="selectedInquirePassowrdPeriod">
        <nb-option (click)="onChangeInquirePassowrdPeriod()" [value]="30">{{ 'password_period_30_seconds' | i18n }}</nb-option>
        <nb-option (click)="onChangeInquirePassowrdPeriod()" [value]="60">{{ 'password_period_1_minute' | i18n }}</nb-option>
      </nb-select>
    </app-settings-item>
    <app-change-password
      [disabled]="!isHasPassword"
      class="password__item password__change-password"
      (onSubmit)="submitChangePassword($event)">
    </app-change-password>
	</div>
</app-layout>
