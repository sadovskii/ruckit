<div class="reset-confirm">
  <p class="reset-confirm__intro">
    {{ 'password_reset_confirm_intro' | i18n }}
    <span class="reset-confirm__delay">{{ 'password_reset_confirm_intro_delay' | i18n: delayLabel }}</span>
  </p>
  <ruckit-info-block
    class="reset-confirm__info"
    icon="clock-20"
    [header]="'password_reset_confirm_info_title' | i18n"
    [lines]="['password_reset_confirm_info_text' | i18n]">
  </ruckit-info-block>
  <button class="reset-confirm__button" nbButton fullWidth type="button" (click)="startReset.emit()">
    {{ 'password_reset_start' | i18n }}
  </button>
  <button class="reset-confirm__button" nbButton fullWidth outline type="button" (click)="goBack.emit()">
    {{ 'password_reset_back' | i18n }}
  </button>
</div>
