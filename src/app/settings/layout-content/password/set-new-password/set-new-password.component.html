<ruckit-dialog
  [header]="'password_set_title' | i18n"
  [tagValue]="'password_set_tag' | i18n"
  [tagType]="TagType.Green"
  (closed)="onClose()">
  <div class="set-new-password">
    <h6 class="set-new-password__hint hint">{{ 'password_set_hint' | i18n }}</h6>
    <form class="set-new-password-inputs" [formGroup]="formGroup" (ngSubmit)="onSubmit()">
      <ruckit-password-input
        class="set-new-password-inputs__item password-input"
        formControlName="enterPassword"
        [status]="invalidAfterClick && formGroup.controls.enterPassword.invalid ? 'danger' : 'basic'"
        [fullWidth]="true"
        [placeholder]="'password_new_placeholder' | i18n">
      </ruckit-password-input>
      <ruckit-password-input
        class="set-new-password-inputs__item password-input"
        formControlName="confirmPassword"
        [status]="invalidAfterClick && formGroup.controls.confirmPassword.invalid ? 'danger' : 'basic'"
        [fullWidth]="true"
        [placeholder]="'password_confirm_new_placeholder' | i18n">
      </ruckit-password-input>
      <button nbButton fullWidth>{{ 'password_set_submit' | i18n }}</button>
    </form>
  </div> 
</ruckit-dialog>
