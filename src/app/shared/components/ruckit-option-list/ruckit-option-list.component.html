<input
	class="search input"
	nbInput
	fullWidth
	[placeholder]="placeholder"
	[formControl]="searchFormControl"
	[status]="invalidAfterClick && searchFormControl.invalid ? 'danger' : 'basic'">
<div
	class="option-list-container">
	<div
		class="option-list-container-wrapper"
		[ngStyle]="{'height': height }">
		@if (filteredOptionList && filteredOptionList.length > 0) {
			<div
				*ngFor="let item of filteredOptionList; let i = index; trackBy: trackOptionList"
				class="option-list-container-wrapper__option-list-item option-list-item">
				<h6 class="option-list-item__name">{{item.option}}</h6>
				<nb-icon
					class="option-list-item__icon icon"
					(click)="remove(item.id)"
					icon="cross-21"
					pack="ruckit-21">
				</nb-icon>
			</div>
		}
		@else if (filteredOptionList.length === 0 && searchFormControl.value) {
			<div class="option-list-unfound">
				<h6 class="option-list-unfound__content">{{ 'option_list_not_found' | i18n }}</h6>
				<!--Hideed adding logic from settings-->
				<button
					*ngIf="enableAdding"
					class="option-list-unfound__add-item"
					nbButton
					size="tiny"
					outline
					(click)="addItemClick()"
				>
					{{ 'option_list_add_new' | i18n }}
				</button>
			</div>
		}
		@else {	
			<div class="option-list-empty">
				<h6 class="option-list-empty__content">{{ 'option_list_empty' | i18n }}</h6>
			</div>
		}
	</div>
</div>
